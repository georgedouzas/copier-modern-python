[tool.black]
line-length = 120
skip-string-normalization = true
target-version = ["py311"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
ignore = ["D202", "N806", "N803", "S101", "INP001", "Q000", "TRY002", "PLR0913", "EXE001", "EXE002", "E741"]
select = ["C", "E", "F", "W", "B", "I", "D", "N", "UP", "YTT", "ANN", "S",
"BLE", "A", "COM", "C4", "DTZ", "T10", "EM", "EXE", "ISC", "ICN", "G",
"INP", "PIE", "T20", "PT", "Q", "RET501", "RET502", "RET503", "SIM",
"PTH", "PD", "PGH", "PL", "TRY", "RUF", "PLE", "PLR", "PLW"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["T20", "ANN401", "S603"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
ignore_missing_imports = true
warn_unused_ignores = true
show_error_codes = true

[dependency-groups]
dev = [
    "copier>=9",
    "PyYAML>=6",
    "properdocs>=1.6.7",
    "mkdocs-material>=9.1.2",
    "markdown-exec>=1.3.0",
    "mkdocs-section-index>=0.3.5",
    "git-changelog>=1.0.0",
    "mdx-truly-sane-lists>=1.3",
]
