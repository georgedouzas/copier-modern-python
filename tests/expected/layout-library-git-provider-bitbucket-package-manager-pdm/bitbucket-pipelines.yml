image: python:3.11

pipelines:
  default:
    - step:
        name: Test
        caches:
          - pip
        script:
          - pip install pdm uv
          - pdm install
          - pdm tests
        artifacts:
          - coverage.xml
          - htmlcov/**

    - step:
        name: Quality Checks
        caches:
          - pip
        script:
          - pip install pdm uv
          - pdm install
          - pdm checks

  branches:
    main:
      - step:
          name: Test
          caches:
            - pip
          script:
            - pip install pdm uv
            - pdm install
            - pdm tests
          artifacts:
            - coverage.xml
            - htmlcov/**

      - step:
          name: Quality Checks
          caches:
            - pip
          script:
            - pip install pdm uv
            - pdm install
            - pdm checks

      - step:
          name: Build Documentation
          caches:
            - pip
          script:
            - pip install pdm uv
            - pdm install
            - pdm docs build
          artifacts:
            - site/**

  tags:
    '*':
      - step:
          name: Test
          caches:
            - pip
          script:
            - pip install pdm uv
            - pdm install
            - pdm tests

      - step:
          name: Quality Checks
          caches:
            - pip
          script:
            - pip install pdm uv
            - pdm install
            - pdm checks

      # The `release` nox session is the local kickoff that tags the commit. The
      # pipeline is the only publisher, so it just builds and uploads the tag,
      # and the steps above have to pass before this one runs.
      - step:
          name: Release to PyPI
          caches:
            - pip
          script:
            - pip install pdm uv twine
            - pdm build
            - twine upload --skip-existing dist/*
          trigger: manual

definitions:
  caches:
    pip: ~/.cache/pip
