_min_copier_version: "9"
_envops:
  autoescape: false
  keep_trailing_newline: true
_subdirectory: project
_templates_suffix: .jinja
_skip_if_exists:
- CHANGELOG.md

# Project
project_description:
  type: str
  help: Your project description

# Author
author_fullname:
  type: str
  help: Your full name

author_email:
  type: str
  help: Your email

# Git hosting
git_provider:
  type: str
  help: Your Git provider
  default: GitHub
  choices:
    - GitHub
    - Azure DevOps
    - Bitbucket
    - GitLab
    - None

author_username:
  type: str
  help: Your account on the chosen Git provider (used for commit links and your profile)
  when: "{{ git_provider != 'None' }}"
  default: ""

repository_namespace:
  type: str
  help: Owner of the repository on the Git provider (e.g. your username for personal projects, or your company or organization)
  when: "{{ git_provider != 'None' }}"
  default: "{{ author_username }}"

repository_name:
  type: str
  help: Your repository name

azure_devops_project:
  type: str
  help: Azure DevOps project that contains the repository (organizations group repositories under projects)
  when: "{{ git_provider == 'Azure DevOps' }}"
  default: "{{ repository_name }}"

# Python
# The newest Python minor version the template supports. A range without an upper bound runs up to it.
python_newest_supported:
  type: int
  default: 14
  when: false

python_versions:
  type: str
  help: >-
    The range of Python versions that your project supports, as a lower bound `>=3.N` or `>3.N`
    optionally followed by an upper bound `<3.M` or `<=3.M`, for example `>=3.11, <3.14` or `>=3.12`
  default: ">=3.11, <3.15"
  validator: |-
    {%- set bounds = python_versions | regex_search('^\\s*(>=?)\\s*3\\.(\\d+)(?:\\.\\d+)?\\s*(?:,\\s*(<=?)\\s*3\\.(\\d+)\\s*)?$', '\\1', '\\2', '\\3', '\\4') -%}
    {%- if not bounds -%}
    Use a lower bound `>=3.N` or `>3.N`, optionally followed by an upper bound `<3.M` or `<=3.M`, for example `>=3.11, <3.14` or `>=3.12`
    {%- else -%}
    {%- set lowest = bounds[1] | int + (1 if bounds[0] == '>' else 0) -%}
    {%- set highest = (bounds[3] | int - (1 if bounds[2] == '<' else 0)) if bounds[3] else python_newest_supported -%}
    {%- if lowest < 11 -%}
    Minimum version is Python 3.11
    {%- elif highest < lowest -%}
    The range contains no Python version the template supports
    {%- endif -%}
    {%- endif -%}

# The Python versions a generated project declares, tests, and builds against, derived from `python_versions`.
python_test_versions:
  type: yaml
  default: |-
    {%- set bounds = python_versions | regex_search('^\\s*(>=?)\\s*3\\.(\\d+)(?:\\.\\d+)?\\s*(?:,\\s*(<=?)\\s*3\\.(\\d+)\\s*)?$', '\\1', '\\2', '\\3', '\\4') -%}
    {%- if bounds -%}
    {%- set lowest = bounds[1] | int + (1 if bounds[0] == '>' else 0) -%}
    {%- set highest = (bounds[3] | int - (1 if bounds[2] == '<' else 0)) if bounds[3] else python_newest_supported -%}
    [{% for minor in range(lowest, highest + 1) %}"3.{{ minor }}"{{ ", " if not loop.last }}{% endfor %}]
    {%- else -%}
    []
    {%- endif -%}
  when: false

package_manager:
  type: str
  help: Your Python package manager
  default: PDM
  choices:
    - PDM
    - uv

project_layout:
  type: str
  help: The kind of project you are starting
  default: library
  choices:
    "Library, an importable package you distribute to others": library
    "Command line tool, a program people run from a terminal": script
    "Machine learning, experiments and models with notebooks alongside code": ml
    "Data engineering, pipelines that move and shape data": dataeng
    "Service, a web API you deploy and run": service

include_dockerfile:
  type: bool
  help: Include a Dockerfile for building a container image
  default: "{{ project_layout in ['dataeng', 'service'] }}"

# AI assistants
spec_tool:
  type: str
  help: The spec-driven workflow tool your project ships with, seeding its engineering constitution
  default: openspec
  choices:
    "OpenSpec, AI-native spec-driven development (run `openspec init` to complete the setup)": openspec
    "Spec Kit, GitHub's spec-driven development kit (run `specify init` to complete the setup)": speckit
    "None": none

# Distribution
publish_pypi:
  type: bool
  help: Publish your project to PyPI
  when: "{{ project_layout not in ['ml', 'dataeng', 'service'] }}"
  default: "{{ project_layout not in ['ml', 'dataeng', 'service'] }}"

python_package_distribution_name:
  type: str
  help: Your Python package distribution name (for `pip install NAME`)
  when: "{{ publish_pypi }}"
  default: "{{ repository_name|lower|replace('-', '_')|replace(' ', '_') }}"

python_package_import_name:
  type: str
  help: Your Python package import name (for `import NAME` in Python code)
  default: "{{ repository_name|lower|replace('-', '_')|replace(' ', '_') }}"

# Legal
copyright_license:
  type: str
  help: Your project's license
  default: MIT License
  choices:
    - Academic Free License v3.0
    - Apache License 2.0
    - Artistic License 2.0
    - BSD 2-Clause "Simplified" License
    - BSD 3-Clause Clear License
    - BSD 3-Clause "New" or "Revised" License
    - Boost Software License 1.0
    - Creative Commons Attribution 4.0
    - Creative Commons Attribution Share Alike 4.0
    - Creative Commons Zero v1.0 Universal
    - Do What The F*ck You Want To Public License
    - Educational Community License v2.0
    - Eclipse Public License 1.0
    - Eclipse Public License 2.0
    - European Union Public License 1.1
    - European Union Public License 1.2
    - GNU Affero General Public License v3.0
    - GNU General Public License v2.0
    - GNU General Public License v3.0
    - GNU Lesser General Public License v2.1
    - GNU Lesser General Public License v3.0
    - ISC License
    - LaTeX Project Public License v1.3c
    - MIT License
    - Mozilla Public License 2.0
    - Microsoft Public License
    - Microsoft Reciprocal License
    - University of Illinois/NCSA Open Source License
    - SIL Open Font License 1.1
    - Open Software License 3.0
    - PostgreSQL License
    - The Unlicense
    - zlib License
    - None

copyright_holder:
  type: str
  help: Person or organization holding the copyright (often the company that owns the repository, not the author)
  default: "{{ author_fullname }}"

copyright_holder_email:
  type: str
  help: The email of the person/entity holding the copyright
  default: "{{ author_email }}"

copyright_date:
  type: str
  help: The copyright date
  default: "{{ '%Y' | strftime }}"
