schema: spec-driven

context: |
  The engineering constitution in openspec/constitution.md binds all work in this repository.
  The constraints that most often decide a change:
  - The generated project is the product. Every generated project must install, pass its own
    checks, and pass its own tests immediately after generation.
  - Matrix parity. A behavioural change to one branch of layout x git provider x package
    manager is applied to, or explicitly declined for, every other branch in the same change.
  - Fixtures are the specification. tests/expected/ is regenerated by rendering, never
    hand-edited, and every commit leaves make tests green.
  - Verify by execution, not inspection. Claims about generated projects are established by
    running them.
  - Commits follow the Angular convention (feat, fix, docs, style, refactor, tests, chore),
    with bodies that explain what was broken and why the change is correct. Out-of-scope fixes
    are committed separately.
  - Prose follows the constitution's writing style: no semicolon and no dash as sentence
    punctuation, lines at most 120 characters, plain words.

rules:
  proposal:
    - State what is out of scope
    - Name every affected branch of the layout, provider, and package manager matrix
  tasks:
    - Every behavioural claim gets a verify-by-execution task
    - A change that alters rendered output includes a regen-fixtures task that confirms the
      diff moves only where intended

operations:
  apply:
    guidance:
      - Run make tests before marking implementation complete
  archive:
    guidance:
      - Confirm fixtures were regenerated in the same commit as the template edit they reflect
